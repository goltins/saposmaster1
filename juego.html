<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego Sapo 🐸</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #4facfe;
}

#game {
  position: relative;
  width: 100%;
  height: 100vh;
}

  #sapo {
  position: absolute;
  bottom: 50px;
  left: 30px;
  font-size: 80px;
}

.obstaculo {
  position: absolute;
  bottom: 50px;
  right: -80px;
  font-size: 80px;
}

@keyframes mover {
  from { right: -50px; }
  to { right: 100%; }
}
</style>
</head>

<body>

<div id="game">
  <div id="sapo">🐸</div>
</div>

<script>
let sapo = document.getElementById("sapo");
let saltando = false;

// SALTO
document.addEventListener("click", () => {
  if (!saltando) {
    saltando = true;
    let altura = 0;

    let subir = setInterval(() => {
      if (altura >= 200) {
        clearInterval(subir);
        let bajar = setInterval(() => {
          if (altura <= 0) {
            clearInterval(bajar);
            saltando = false;
          }
          altura -= 5;
          sapo.style.bottom = altura + "px";
        }, 20);
      }
      altura += 5;
      sapo.style.bottom = altura + "px";
    }, 20);
  }
});

// OBSTÁCULO
function crearObstaculo() {
  let obs = document.createElement("div");
  obs.classList.add("obstaculo");
  obs.innerText = "🚧";
  document.getElementById("game").appendChild(obs);

  let mover = setInterval(() => {
    let sapoRect = sapo.getBoundingClientRect();
    let obsRect = obs.getBoundingClientRect();

    if (
      sapoRect.right > obsRect.left &&
      sapoRect.left < obsRect.right &&
      sapoRect.bottom > obsRect.top
    ) {
      alert("Perdiste 😢");
      location.reload();
    }
  }, 10);

  setTimeout(() => {
    obs.remove();
    clearInterval(mover);
  }, 2000);
}

// ESPERA ANTES DE EMPEZAR
setTimeout(() => {
  setInterval(crearObstaculo, 2000);
}, 2000);
</script>

</body>
</html>
